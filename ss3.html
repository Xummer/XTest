<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>截图监听</title>
  <style>
    :root {
      --bg: #f6f7f8;
      --card: #fff;
      --text: #18191c;
      --sub: #9499a0;
      --pink: #fb7299;
      --line: #e3e5e7;
      --ok: #2ab27b;
      --bad: #f25d5d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181a;
        --card: #232427;
        --text: #e3e5e7;
        --sub: #757a81;
        --line: #2f3134;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
      min-height: 100vh;
    }
    .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    h1 { font-size: 18px; margin-bottom: 8px; }
    .status { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--sub); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sub); flex: none; }
    .dot.ok { background: var(--ok); }
    .dot.bad { background: var(--bad); }
    .count { font-size: 40px; font-weight: 600; color: var(--pink); margin-top: 12px; }
    .count small { font-size: 14px; color: var(--sub); font-weight: normal; margin-left: 4px; }
    .log-title { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
    .log-title button { border: 0; background: none; color: var(--pink); font-size: 14px; }
    #log { font: 12px/1.6 ui-monospace, Menlo, monospace; color: var(--sub); word-break: break-all; white-space: pre-wrap; max-height: 40vh; overflow-y: auto; }
    #log div { border-bottom: 1px dashed var(--line); padding: 4px 0; }

    /* 弹窗 */
    .mask {
      position: fixed; inset: 0; background: rgba(0,0,0,.5);
      display: flex; align-items: center; justify-content: center; padding: 32px;
      opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10;
    }
    .mask.show { opacity: 1; pointer-events: auto; }
    .dialog {
      width: 100%; max-width: 300px; background: var(--card); border-radius: 12px; overflow: hidden;
      transform: scale(.9); transition: transform .2s; text-align: center;
    }
    .mask.show .dialog { transform: scale(1); }
    .dialog .body { padding: 24px 20px 20px; }
    .dialog h2 { font-size: 17px; margin-bottom: 8px; }
    .dialog p { font-size: 14px; color: var(--sub); line-height: 1.5; }
    .dialog button {
      width: 100%; height: 48px; border: 0; border-top: 1px solid var(--line);
      background: none; color: var(--pink); font-size: 16px; font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>截图监听</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="status">初始化中…</span></div>
    <div class="count"><span id="count">0</span><small>次截图</small></div>
  </div>

  <div class="card">
    <div class="log-title"><span>回调日志</span><button id="clear">清空</button></div>
    <div id="log"></div>
  </div>

  <div class="mask" id="mask">
    <div class="dialog">
      <div class="body">
        <h2>检测到截图</h2>
        <p id="msg">你刚刚截了一张图</p>
      </div>
      <button id="close">知道了</button>
    </div>
  </div>

  <script src="https://s1.hdslb.com/bfs/seed/jinkela/short/jsb/js-bridge.min.js"></script>
  <script>
    (function () {
      var METHOD = 'ability.observeScreenshot';
      var TIMEOUT = 3000;
      var $ = function (id) { return document.getElementById(id); };
      var count = 0;

      function setStatus(text, state) {
        $('status').textContent = text;
        $('dot').className = 'dot' + (state ? ' ' + state : '');
      }

      function log(label, data) {
        var line = document.createElement('div');
        var time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
        var body = '';
        if (data !== undefined) {
          try { body = ' ' + JSON.stringify(data); } catch (e) { body = ' ' + String(data); }
        }
        line.textContent = '[' + time + '] ' + label + body;
        $('log').prepend(line);
      }

      function showDialog() {
        count++;
        $('count').textContent = count;
        $('msg').textContent = '这是第 ' + count + ' 次截图';
        $('mask').classList.add('show');
      }

      // SDK 在通道缺失时部分 Promise 永远不 settle，统一加超时
      function withTimeout(promise, name, ms) {
        return new Promise(function (resolve, reject) {
          var timer = setTimeout(function () { reject(new Error(name + ' 超时')); }, ms || TIMEOUT);
          promise.then(function (v) { clearTimeout(timer); resolve(v); },
                       function (e) { clearTimeout(timer); reject(e); });
        });
      }

      function dumpEnv() {
        var wk = window.webkit && window.webkit.messageHandlers;
        var st = window.BiliJsBridge || {};
        log('UA', navigator.userAgent);
        log('env', {
          biliInject: !!(window.biliInject || (wk && wk.biliInject)),
          biliInjectV2: !!(window.biliInjectV2 || (wk && wk.biliInjectV2)),
          inited: st.inited,
          noBiliInject: st.noBiliInject,
          jsbV2Inited: st.jsbV2Inited,
          noBiliInjectV2: st.noBiliInjectV2,
          v2ApiCount: (st.jsbV2ApiList || []).length,
          v2HasMethod: (st.jsbV2ApiList || []).indexOf(METHOD) > -1
        });
      }

      $('close').onclick = function () { $('mask').classList.remove('show'); };
      $('clear').onclick = function () { $('log').innerHTML = ''; };

      var jsb = window.JsBridge;
      if (!jsb) {
        setStatus('js-bridge.min.js 加载失败', 'bad');
        return;
      }
      if (!jsb.inBiliApp) {
        setStatus('非哔哩哔哩 App 环境，无法监听截图', 'bad');
        log('UA', navigator.userAgent);
        return;
      }

      var bridge = jsb.biliBridge;

      // V1 通道：callback 常驻，Native 每次截图都能回调
      function observeV1() {
        bridge.callNative({
          method: METHOD,
          data: {},
          callback: function (res) {
            log('v1 callback', res);
            showDialog();
          }
        });
        setStatus('监听中（V1），试试截个图', 'ok');
      }

      // V2 通道：SDK 会在首次回调后移除 callback，所以每次回调后重新注册；
      // 若 Native 注册即回调（ack），短时间内连续回调会被熔断，避免死循环
      var recent = [];
      function observeV2() {
        bridge.useNative(METHOD, {}).then(function (res) {
          log('v2 callback', res);
          var now = Date.now();
          recent = recent.filter(function (t) { return now - t < 2000; });
          recent.push(now);
          if (recent.length > 3) {
            setStatus('V2 回调过于频繁，已停止重新注册，请看日志', 'bad');
            return;
          }
          showDialog();
          observeV2();
        }, function (err) {
          log('v2 error', err);
          setStatus('V2 调用失败，请看日志', 'bad');
        });
        setStatus('监听中（V2），试试截个图', 'ok');
      }

      function checkV1() {
        return withTimeout(bridge.isSupport(METHOD), 'isSupport(V1)')
          .catch(function (e) { log('warn', e.message); return false; })
          .then(function (ok) {
            var apis = (window.BiliJsBridge || {}).appSupportApis || [];
            log('isSupport(V1)', ok);
            log('ability.* (' + apis.length + ' total)', apis.filter(function (m) { return m.indexOf('ability.') === 0; }));
            return ok;
          });
      }

      // 参考页的「添加 namespace」：global.import 之后该 namespace 的方法才进支持列表
      function importNamespace(ns) {
        return withTimeout(new Promise(function (resolve) {
          bridge.callNative({ method: 'global.import', data: { namespace: ns }, callback: resolve });
        }), 'global.import(' + ns + ')')
          .then(function (res) { log('global.import(' + ns + ')', res); })
          .catch(function (e) { log('warn', e.message); });
      }

      setStatus('等待 JSBridge 初始化…');
      withTimeout(jsb.initPromise || Promise.resolve(), 'initPromise', 6000)
        .catch(function (e) { log('warn', e.message); })
        .then(function () {
          dumpEnv();
          setStatus('检测 V1 支持…');
          return checkV1();
        })
        .then(function (v1) {
          if (v1) return true;
          setStatus('导入 ability namespace…');
          return importNamespace(METHOD.split('.')[0]).then(checkV1);
        })
        .then(function (v1) {
          if (v1) return observeV1();
          setStatus('检测 V2 支持…');
          return withTimeout(bridge.canIUse(METHOD), 'canIUse(V2)')
            .catch(function (e) { log('warn', e.message); return false; })
            .then(function (v2) {
              log('canIUse(V2)', v2);
              if (v2) return observeV2();
              // 支持列表只是 SDK 侧的门槛，callNative 本身不校验，直接注册试试
              observeV1();
              setStatus('支持列表中没有 ' + METHOD + '，已强制注册，试试截图', 'bad');
            });
        });
    })();
  </script>
</body>
</html>
